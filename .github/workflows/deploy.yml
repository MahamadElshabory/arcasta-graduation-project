name: 🚀 Deploy Node.js Backend to Droplet

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: SSH Deploy to Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/backend

            echo "🛑 Stopping existing PM2 processes..."
            pm2 stop all || true
            pm2 delete all || true

            echo "🔄 Syncing repo with GitHub main..."
            git fetch --all
            git reset --hard origin/main

            echo "🧹 Cleaning old node_modules (keep package-lock.json)..."
            rm -rf node_modules
            rm -rf Website/node_modules
            rm -rf mobile/node_modules

            echo "📦 Installing root dependencies..."
            npm ci --omit=dev

            echo "📦 Installing Website dependencies..."
            npm ci --prefix Website --omit=dev

            echo "🚀 Starting Website backend with PM2..."
            cd Website
            pm2 start app.js --name website-backend
            pm2 start worker_db.js --name worker-db
            cd ..

            echo "📦 Installing Mobile dependencies..."
            npm ci --prefix mobile --omit=dev

            echo "🚀 Starting Mobile backend with PM2..."
            cd mobile
            pm2 start app.js --name mobile-backend
            cd ..

            echo "💾 Saving PM2 process list..."
            pm2 save
